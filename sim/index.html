<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="対戦練習">
<meta name="theme-color" content="#07080c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ペルソナ対戦練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Dela+Gothic+One&family=Oswald:wght@500;600;700&family=Noto+Sans+Mono:wght@700&display=swap">
<style>
/* ヴァンガード×ペルソナ30th テーマ(2026/11/03)
   - 盤面:黒いプレイマット(1つ前のプレイマットの雰囲気)に、今のルールの配置(左にダメージゾーン、中央にサークル、右に山札・ドロップ・オーダーゾーン)
   - サークル:ヴァンガード=赤、リアガード=緑、ガーディアン=青(公式マットの色分け)。紋章は独自の輪と文字
   - ペルソナ30th:デッキ色の斜めスラッシュ、斜めの見出し帯、太い見出し文字
   - デジタル庁デザインシステムから残すもの:黄色+黒のフォーカスリング、44px以上の押しやすいボタン、読みやすい本文の文字と行間、色だけに頼らない表示 */
:root{
  color-scheme:dark;
  --ink:#f4f5f8; --text:#d9dce4; --muted:#9aa1b2; --line:rgba(255,255,255,.16); --line2:rgba(255,255,255,.28);
  --bg:#07080c; --panel:#11141c; --panel2:#181c27; --glass:rgba(12,14,20,.78);
  --v:#ff3b47; --r:#34d27b; --g:#3f8cff; --gold:#ffcf3d; --focus:#ffd43d;
  --key:#2f5bff; --key-2:#5f86ff; --key-ink:#ffffff;
  --p3:#2b8cff; --p3p:#e040e0; --p4:#ffc61a; --p5:#ff2d2d;
  --crit:#ff4b4b; --draw:#ffc61a; --front:#3f9bff; --heal:#38d27b; --over:#a66bff; --sent:#aab1c0;
  --deck:#ff2d2d;
  --body:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  --disp:'Dela Gothic One','Noto Sans JP',sans-serif;
  --en:'Oswald','Noto Sans JP',sans-serif;
  --num:'Oswald','Noto Sans Mono',ui-monospace,monospace;
}
:focus-visible{outline:3px solid var(--focus)!important;outline-offset:2px!important;box-shadow:0 0 0 6px #000!important}
::selection{background:var(--gold);color:#000}
.deck-P3{--deck:var(--p3)}.deck-P3P{--deck:var(--p3p)}.deck-P4{--deck:var(--p4)}.deck-P5{--deck:var(--p5)}
.deck-P3PT{--deck:var(--p3p)}.deck-P5A{--deck:var(--p5)}

/* ---------- プレイマット */
.vgmat{--deck2:color-mix(in srgb,var(--deck) 34%,transparent);
  position:relative;border-radius:14px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse 60% 70% at 50% 55%,rgba(255,255,255,.07),transparent 70%),
    repeating-radial-gradient(circle at 50% 55%,rgba(255,255,255,.035) 0 1px,transparent 1px 26px),
    linear-gradient(118deg,transparent 0 70%,var(--deck2) 70% 71.2%,transparent 71.2% 73%,color-mix(in srgb,var(--deck) 16%,transparent) 73% 79%,transparent 79%),
    linear-gradient(180deg,#14171f,#0b0d12);
  border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.5)}
.vgmat::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:
    linear-gradient(90deg,transparent 49.9%,rgba(255,255,255,.05) 50%,transparent 50.1%),
    conic-gradient(from 0deg at 50% 55%,transparent 0 10deg,rgba(255,255,255,.03) 10deg 11deg,transparent 11deg 40deg,rgba(255,255,255,.03) 40deg 41deg,transparent 41deg 90deg,rgba(255,255,255,.03) 90deg 91deg,transparent 91deg 130deg,rgba(255,255,255,.03) 130deg 131deg,transparent 131deg 180deg,rgba(255,255,255,.03) 180deg 181deg,transparent 181deg 220deg,rgba(255,255,255,.03) 220deg 221deg,transparent 221deg 270deg,rgba(255,255,255,.03) 270deg 271deg,transparent 271deg 310deg,rgba(255,255,255,.03) 310deg 311deg,transparent 311deg)}
.vgmat.turn{border-color:color-mix(in srgb,var(--deck) 70%,#fff 0%);box-shadow:inset 0 0 0 1px var(--deck),0 0 0 1px var(--deck),0 0 22px color-mix(in srgb,var(--deck) 45%,transparent)}

/* サークル(紋章は独自デザイン:目盛りの輪+文字) */
.em{position:absolute;left:50%;top:50%;width:calc(var(--cw)*1.22);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  --c:var(--r);
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent) 0 44%,transparent 45% 100%);
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 85%,transparent),0 0 14px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 40%,transparent)}
.em::before{content:"";position:absolute;inset:7%;border-radius:50%;
  background:repeating-conic-gradient(color-mix(in srgb,var(--c) 85%,transparent) 0 2deg,transparent 2deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 0 62%,#000 63% 70%,transparent 71%);mask:radial-gradient(circle,transparent 0 62%,#000 63% 70%,transparent 71%)}
.em::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font:italic 700 calc(var(--cw)*.52)/1 var(--en);
  color:color-mix(in srgb,var(--c) 92%,#fff);text-shadow:0 0 10px var(--c),0 2px 0 #000;letter-spacing:-.02em}
.em.v{--c:var(--v);width:calc(var(--cw)*1.32)}
.em.v::before{background:repeating-conic-gradient(color-mix(in srgb,var(--c) 90%,transparent) 0 1.5deg,transparent 1.5deg 7.5deg)}
.em.g{--c:var(--g)}
.slot .lb{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,100%);font:600 9px/1.2 var(--body);color:var(--muted);white-space:nowrap;letter-spacing:.04em}

/* ゾーンの枠 */
.zt{border:1px solid var(--line2);border-radius:6px;background:rgba(0,0,0,.38);position:relative}
.zt .zl{display:flex;align-items:baseline;justify-content:space-between;gap:4px;font:700 10px/1.2 var(--body);color:var(--text);letter-spacing:.04em;white-space:nowrap}
.zt .zl small{font:500 8.5px/1 var(--en);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.zt .zv{font:600 clamp(16px,calc(var(--cw)*.36),26px)/1 var(--num);color:var(--ink);font-variant-numeric:tabular-nums}
.back{border-radius:5px;background:
  radial-gradient(circle at 50% 50%,rgba(120,170,255,.35) 0 12%,transparent 13% 22%,rgba(120,170,255,.25) 23% 24%,transparent 25% 34%,rgba(120,170,255,.18) 35% 36%,transparent 37%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 8px),
  linear-gradient(160deg,#1b2a55,#0a1128);
  box-shadow:inset 0 0 0 2px rgba(180,200,255,.35),0 3px 8px rgba(0,0,0,.6)}

/* 名前の帯(ペルソナの斜め帯) */
.band{display:inline-flex;align-items:center;gap:8px;transform:skewX(-14deg);background:var(--deck);color:#fff;padding:2px 12px 2px 10px;box-shadow:4px 4px 0 rgba(0,0,0,.55)}
.band > *{transform:skewX(14deg)}
.deck-P4 .band,.band.deck-P4{color:#111}
.band b{font:400 14px/1.3 var(--disp);letter-spacing:.02em;white-space:nowrap}
.band .g{font:italic 600 12px/1 var(--en);opacity:.9}

/* 数字(パワー) */
.pw{font:600 11px/1.25 var(--num)!important;letter-spacing:.02em;background:rgba(0,0,0,.82)!important;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:3px!important}
.pw.up{background:linear-gradient(90deg,#b31212,#ff5a1f)!important;border-color:#ffb199}

/* ボタン(DADSの大きさ・フォーカスを残し、色と形をゲーム風に) */
.vbtn{font:700 16px/1.3 var(--body);min-height:48px;padding:10px 18px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer}
@media (hover:hover){.vbtn:hover{border-color:var(--gold);background:#222838}}
.vbtn.primary{position:relative;border:0;color:#fff;background:linear-gradient(100deg,#d0101f,#ff3b2f 55%,#ff7a2f);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);
  font:400 20px/1.2 var(--disp);letter-spacing:.06em;min-height:60px;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:none}
.vbtn.primary small{display:block;font:italic 600 12px/1.2 var(--en);letter-spacing:.3em;opacity:.9}
@media (hover:hover){.vbtn.primary:hover{filter:brightness(1.12)}}

/* ターンの切り替わり演出 */
.banner{position:fixed;left:0;right:0;top:38%;z-index:60;pointer-events:none;display:grid;place-items:center;opacity:0}
.banner.show{animation:bnr 1.25s ease forwards}
.banner div{transform:skewX(-14deg);background:var(--deck);color:#fff;padding:8px 48px;box-shadow:0 0 0 3px #000,8px 8px 0 #000;text-align:center}
.banner.deck-P4 div{color:#111}
.banner b{display:block;transform:skewX(14deg);font:italic 700 clamp(30px,8vw,64px)/1 var(--en);letter-spacing:.06em}
.banner span{display:block;transform:skewX(14deg);font:400 clamp(13px,3vw,18px)/1.4 var(--disp)}
@keyframes bnr{0%{opacity:0;transform:translateX(-30%)}18%{opacity:1;transform:none}75%{opacity:1;transform:none}100%{opacity:0;transform:translateX(30%)}}
@media (prefers-reduced-motion:reduce){.banner.show{animation:bnrr 1.2s linear forwards}@keyframes bnrr{0%,100%{opacity:0}15%,80%{opacity:1}}}

*{box-sizing:border-box;touch-action:manipulation;-webkit-touch-callout:none}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
:root{--ch:60px;--cw:calc(var(--ch)*.6865)}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--body);letter-spacing:.02em;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;letter-spacing:inherit}
.screen{height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}
/* ---------- 開始画面 */
#start{overflow-y:auto;position:relative;isolation:isolate;
  background:
    linear-gradient(118deg,transparent 0 58%,rgba(255,45,45,.85) 58% 59.5%,transparent 59.5% 61%,rgba(255,45,45,.22) 61% 70%,transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(63,140,255,.18),transparent 70%),
    repeating-radial-gradient(circle at 80% 30%,rgba(255,255,255,.035) 0 1px,transparent 1px 30px),
    var(--bg)}
#start .in{max-width:620px;margin:0 auto;width:100%;padding:28px max(16px,env(safe-area-inset-left,0px)) 36px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.logo{display:flex;flex-direction:column;gap:6px}
.logo small{font:italic 600 13px/1 var(--en);letter-spacing:.35em;color:var(--gold)}
.logo h1{margin:0;font:400 clamp(30px,8vw,46px)/1.15 var(--disp);color:#fff;letter-spacing:.02em;text-shadow:3px 3px 0 #c40d1a,6px 6px 0 #000}
.logo .tag2{align-self:flex-start;transform:skewX(-14deg);background:#fff;color:#000;padding:2px 12px;font:italic 700 13px/1.4 var(--en);letter-spacing:.2em}
.logo .tag2 span{display:inline-block;transform:skewX(14deg)}
#start p{color:var(--text);margin:0;font-size:15px;line-height:1.8}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .lab{font:400 15px/1.3 var(--disp);color:#fff;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.grp .lab::before{content:"";width:14px;height:14px;background:var(--gold);transform:skewX(-14deg)}
.decks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dk{position:relative;aspect-ratio:3/4;border:0;padding:0;border-radius:6px;overflow:hidden;cursor:pointer;background:#000;box-shadow:0 0 0 1px var(--line2);min-height:44px}
.dk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:saturate(.85) brightness(.62);transition:filter .2s,transform .3s}
.dk::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.9))}
.dk b{position:absolute;left:8px;bottom:22px;z-index:1;font:italic 700 clamp(18px,5vw,24px)/1 var(--en);color:#fff;letter-spacing:.02em;text-shadow:0 2px 0 #000}
.dk span{position:absolute;left:8px;right:4px;bottom:6px;z-index:1;font-size:10.5px;color:#e6e8ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--deck);z-index:1}
.dk[aria-pressed="true"]{box-shadow:0 0 0 3px var(--deck),0 0 18px color-mix(in srgb,var(--deck) 60%,transparent)}
.dk[aria-pressed="true"] img{filter:none;transform:scale(1.05)}
.dk[aria-pressed="true"] b::after{content:" ✓";font-size:.8em}
@media (hover:hover){.dk[aria-pressed="false"]:hover img{filter:saturate(1) brightness(.85)}}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:64px;min-height:48px;padding:8px 6px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-weight:700;font-size:15px;cursor:pointer;transform:skewX(-10deg);border-radius:2px}
.seg button > span{display:inline-block;transform:skewX(10deg)}
.seg button[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff;box-shadow:4px 4px 0 #c40d1a}
@media (hover:hover){.seg button[aria-pressed="false"]:hover{border-color:var(--gold);color:#fff}}
.big{min-height:52px;padding:12px 16px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.big.go{border:0;color:#fff;background:linear-gradient(100deg,#c40d1a,#ff3b2f 55%,#ff7a2f);clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);font:400 22px/1.2 var(--disp);letter-spacing:.08em;min-height:68px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.big.go small{display:block;font:italic 600 12px/1.3 var(--en);letter-spacing:.4em;opacity:.95}
@media (hover:hover){.big:hover{border-color:var(--gold)}.big.go:hover{filter:brightness(1.12)}}
.big.sub{background:transparent;color:var(--text)}
#loadmsg{font-size:14px;color:var(--muted);text-align:center;min-height:1.5em}
#loadmsg.ok{color:var(--r)}
#start p.hint{font-size:13.5px;line-height:1.7;color:var(--muted)}
/* ---------- 対戦画面 */
#game{position:relative;background:radial-gradient(ellipse 90% 60% at 50% 45%,#141824,#06070a 75%)}
.top{display:flex;align-items:center;gap:6px;padding:4px max(8px,env(safe-area-inset-left,0px)) 4px 8px;flex:none;border-bottom:1px solid var(--line);background:rgba(0,0,0,.5)}
.top .t{font:600 13px/1.3 var(--body);color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t i{font:italic 700 12px/1 var(--en);letter-spacing:.12em;color:var(--gold);margin-left:6px;font-style:italic}
.tb{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:4px;min-height:36px;min-width:44px;padding:2px 10px;font-size:13px;font-weight:700;cursor:pointer}
@media (hover:hover){.tb:hover{border-color:var(--gold)}}
.arena{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;padding:6px 6px 2px;justify-content:center;overflow-y:auto}
.mat{flex:none;width:100%;max-width:calc(var(--cw)*7.4);margin:0 auto;display:grid;grid-template-columns:calc(var(--cw)*.8) auto minmax(calc(var(--cw)*1.3),1fr);gap:calc(var(--cw)*.14);align-items:center;padding:calc(var(--ch)*.08) calc(var(--cw)*.14)}
.mat.opp{grid-template-columns:minmax(calc(var(--cw)*1.3),1fr) auto calc(var(--cw)*.8)}
.mat.opp .dz{order:3}.mat.opp .field{order:2}.mat.opp .rz{order:1}
.field{display:grid;grid-template-columns:repeat(3,var(--cw));gap:calc(var(--ch)*.16) calc(var(--cw)*.26);padding:calc(var(--ch)*.07) calc(var(--cw)*.1)}
.slot{position:relative;width:var(--cw);height:var(--ch)}
.cardw{position:absolute;inset:0;transition:transform .25s;z-index:1}
.slot.rest .cardw{transform:rotate(90deg) scale(.68)}
.cardw img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block;box-shadow:0 3px 10px rgba(0,0,0,.75);outline:1px solid rgba(255,255,255,.25)}
.slot.rest img{filter:brightness(.75) saturate(.8)}
.pw{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);padding:0 4px;white-space:nowrap;z-index:3;pointer-events:none}
.gg{position:absolute;top:1px;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:700;background:rgba(0,0,0,.85);color:var(--gold);padding:0 3px;border-radius:3px;white-space:nowrap;z-index:3;max-width:110%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.lk{position:absolute;inset:0;border:2px dashed var(--v);border-radius:4px;pointer-events:none;background:rgba(255,59,71,.12);z-index:2}
.lk::after{content:"LOCK";position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-12deg);font:italic 700 10px/1 var(--en);letter-spacing:.1em;background:var(--v);color:#fff;padding:1px 4px}
/* ダメージゾーン(左) */
.dz{align-self:stretch;display:flex;flex-direction:column;gap:3px;padding:4px 4px 5px}
.dz .zl{flex-direction:column;align-items:flex-start;gap:1px;font-size:9px}
.dzs{flex:1;display:flex;flex-direction:column;gap:2px;justify-content:flex-end}
.mat.opp .dzs{flex-direction:column-reverse}
.dc{position:relative;height:calc((var(--ch)*1.9 - 40px)/6);min-height:9px;border-radius:2px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.dc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.dc.down img{filter:grayscale(1) brightness(.4)}
.dc.up{border-color:var(--crit)}
.dc i{position:absolute;right:2px;bottom:0;font:italic 600 8px/1 var(--en);color:rgba(255,255,255,.45)}
.dc.d6{border-color:rgba(255,59,71,.5)}
/* 右:山札・ドロップ・オーダーゾーン */
.rz{display:flex;flex-direction:column;gap:4px;min-width:0;align-self:stretch;justify-content:space-between}
.rz .row{display:flex;gap:4px}
.pile{flex:1;min-width:0;padding:2px 4px 3px;display:flex;flex-direction:column;gap:0}
.pile .zl,.oz .zl,.dz .zl{flex-direction:column;align-items:flex-start;gap:0}
.pile .zl{font-size:9.5px}.pile .zl small{font-size:7.5px}
.pile .zv{font-size:clamp(14px,calc(var(--cw)*.32),22px)}
.pile.deckp{background:linear-gradient(160deg,rgba(27,42,85,.9),rgba(10,17,40,.9))}
.oz{padding:3px 4px;display:flex;flex-direction:column;gap:2px;min-height:0}
.arcs{display:flex;flex-wrap:wrap;gap:2px 3px}
.ac{font-size:10px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;white-space:nowrap;color:var(--text);display:inline-flex;align-items:center;gap:2px}
.ac i{display:inline-flex;gap:1px}.ac i u{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.25);text-decoration:none}.ac i u.on{background:var(--gold)}
.ac.full{border-color:var(--gold);color:var(--gold);font-weight:700}
.gzl{display:flex;gap:3px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--gold);font-weight:700}
.gzl img{width:18px;border-radius:2px}
.nmr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.nmr .who{font:italic 700 10px/1 var(--en);letter-spacing:.18em;color:var(--muted)}
.ohand{display:flex;gap:2px;align-items:center;font:600 12px/1 var(--num);color:var(--ink)}
.ohand i{width:7px;height:10px;border-radius:1px;background:linear-gradient(160deg,#2a3f7a,#0a1128);border:1px solid rgba(180,200,255,.4);display:block}
/* ガーディアンサークル(2つのマットの間) */
.gcz{position:relative;height:calc(var(--ch)*.42);display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
.gcz .em{position:relative;left:auto;top:auto;transform:none;width:calc(var(--ch)*.4);flex:none}
.gcz .em::after{font-size:calc(var(--ch)*.2)}

<body>
<section class="screen" id="start">
 <div class="in">

 </div>

        <div class="mat vgmat opp" id="matOpp"></div>
        <div class="gcz" id="gcz" aria-label="ガーディアンサークル"></div>

<div class="sheet" id="pilesheet" hidden><div class="hd"><b id="pileT"></b><button class="tb" id="bPileClose" type="button">閉じる</button></div><p class="pnote" id="pileN"></p><div id="pileG"></div></div>

  <button class="big sub" id="mNew" type="button">対戦をやめてデッキ選択へ</button>
  <button class="big sub" id="mClose" type="button">閉じる</button></div></div>

<script>
const DECKS = ["P3","P3P","P4","P5"];
const NAMES = {P3:"P3 S.E.E.S.", P3P:"P3P 特別課外活動部", P4:"P4 自称特別捜査隊", P5:"P5 心の怪盗団"};
const LS = "persona-sim-v1";
const $ = id => document.getElementById(id);
let TOK = {};
fetch("tokens.json").then(r => r.json()).then(j => TOK = j).catch(() => {});
let TT = {};
fetch("tokentext.json").then(r => r.json()).then(j => TT = j).catch(() => {});
const TEAMTOK = {P3:"T51", P3P:"T51", P4:"T52", P5:"T53"};
let st = {me:"P5", opp:"P3", first:"rand", ai:"learn", game:null, showAI:true};
try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s) st = Object.assign(st, s); } catch(e) {}
if (st.ai === "strong") st.ai = "search";
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e) {} };

// ---------- エンジン(Web Worker)
const worker = new Worker("worker.js");
let ready = false, reqId = 0, pending = {};
worker.onmessage = e => {
  const m = e.data;
  if (m.type === "ready") { ready = true; $("loadmsg").textContent = "準備できました"; $("loadmsg").classList.add("ok"); return; }
  if (m.type === "fatal") { $("loadmsg").textContent = "読み込みに失敗しました:" + m.msg; return; }
  const p = pending[m.id]; delete pending[m.id];
  if (!p) return;
  if (m.type === "res") p.res(JSON.parse(m.res)); else p.rej(new Error(m.msg));
};
function engine(cfg, answers, cache) {
  return new Promise((res, rej) => { const id = ++reqId; pending[id] = {res, rej}; worker.postMessage({id, cfg, answers, cache: cache || []}); });
}

// ---------- 開始画面
const G3 = {P3:"004", P3P:"005", P4:"011", P5:"017"};
function seg(el, items, cur, on, deckAttr) {
  el.innerHTML = "";
  for (const [v, l] of items) {
    const b = document.createElement("button"); b.type = "button";
    if (deckAttr) { b.className = "dk deck-" + v; b.innerHTML = `<img alt="" src="img/${G3[v]}.webp"><b>${v}</b><span>${NAMES[v].split(" ")[1]}</span>`; b.setAttribute("aria-label", NAMES[v]); }
    else b.innerHTML = `<span>${l}</span>`;
    b.setAttribute("aria-pressed", v === cur); b.onclick = () => on(v); el.appendChild(b);
  }
}
function renderStart() {
  seg($("sMe"), DECKS.map(d => [d, d]), st.me, v => { st.me = v; save(); renderStart(); }, true);
  seg($("sOpp"), DECKS.map(d => [d, d]), st.opp, v => { st.opp = v; save(); renderStart(); }, true);
  seg($("sFirst"), [["first","先攻"],["second","後攻"],["rand","ランダム"]], st.first, v => { st.first = v; save(); renderStart(); });
  seg($("sAi"), [["normal","ふつう"],["learn","強い(学習)"],["search","最強(先読み)"]], st.ai, v => { st.ai = v; save(); renderStart(); });
  $("aiHint").textContent = {
    normal: "いつもの判断(シミュレーターで調整した基準)で、すぐに動きます。",
    learn: "自己対戦360万場面から学んだ「この盤面でこのガードなら何%勝てるか」でガードを選びます。ふつうより約6ポイント強く、すぐに動きます。",
    search: "ダメージが大きくなる場面のガードで、候補ごとに試合の続きを何十回も試して一番勝てる手を選びます。考えるのに数秒かかることがあります。",
  }[st.ai] || "";
  $("bResume").hidden = !(st.game && !st.game.over);
}
function newGame() {
  const first = st.first === "rand" ? Math.random() < .5 : st.first === "first";
  st.game = {cfg:{me:st.me, opp:st.opp, seed:Math.floor(Math.random() * 1e9), first, ai:st.ai}, answers:[], cache:[], over:false};
  save(); openGame();
}
$("bStart").onclick = newGame;
$("bResume").onclick = openGame;

// ---------- 対戦画面
let cur = null, multiSel = new Set(), busy = false, lastActive = null;
function openGame() { prevLog = 1e9; lastActive = null; $("bAi").setAttribute("aria-pressed", st.showAI !== false); $("start").hidden = true; $("game").hidden = false; sizeCards(); advance(); }
function backToStart() { $("game").hidden = true; $("over").hidden = true; $("menu").hidden = true; $("start").hidden = false; renderStart(); }
let prevLog = 0;
async function advance() {
  if (!ready) { $("qt").textContent = "対戦エンジンを読み込み中…"; $("opts").innerHTML = ""; setTimeout(advance, 400); return; }
  busy = true;
  const slow = setTimeout(() => { $("qt").textContent = "相手が考え中…"; $("opts").innerHTML = ""; }, 350);
  try { cur = await engine(st.game.cfg, st.game.answers, st.game.cache); }
  catch (e) { clearTimeout(slow); $("qt").textContent = "エラー:" + e.message; busy = false; return; }
  clearTimeout(slow);
  busy = false; multiSel = new Set();
  st.game.cache = cur.cache || [];
  const fresh = cur.log.slice(Math.min(prevLog, cur.log.length)).filter(l => !/盤面:|手札:/.test(l)).slice(-8);
  prevLog = cur.log.length;
  $("ev").innerHTML = fresh.map(l => { const m = /^\[(自分|相手) T\d+\] (.*)$/.exec(l); return m ? `<div class="${m[1] === "自分" ? "m" : "a"}">${m[1] === "自分" ? "自" : "相"} ${m[2].replace(/</g, "&lt;")}</div>` : ""; }).join("");
  $("ev").scrollTop = 1e6;
  st.game.over = cur.status === "over"; save();
  render();
}
function answer(a) {
  if (busy) return;
  prevLog = cur ? cur.log.length : 0;
  st.game.answers.push(a); save(); advance();
}
$("bUndo").onclick = $("bOvUndo").onclick = () => {
  if (busy || !st.game || !st.game.answers.length) return;
  st.game.answers.pop(); $("over").hidden = true; prevLog = 1e9; save(); advance();
};
$("bAi").onclick = () => { st.showAI = st.showAI === false; save(); $("bAi").setAttribute("aria-pressed", st.showAI !== false); if (cur && cur.status === "ask") renderPanel(cur.q); };
$("bLog").onclick = $("bOvLog").onclick = () => { renderLog(); $("logsheet").hidden = false; };
$("bLogClose").onclick = () => $("logsheet").hidden = true;
$("bPileClose").onclick = () => $("pilesheet").hidden = true;
function showPile(kind, who) {
  if (!cur) return;
  const p = who === "me" ? cur.me : cur.ai;
  const list = kind === "deck" ? (p.deckno || []) : kind === "drop" ? (p.dropno || []) : (p.soulno || []);
  const nm = {deck:"山札", drop:"ドロップ", soul:"ソウル"}[kind];
  $("pileT").textContent = `${who === "me" ? "自分" : "相手"}の${nm}(${list.length}枚)`;
  $("pileN").textContent = kind === "deck" ? "残っているカードを番号順に並べています(山札の順番はわかりません)。タップで拡大。" : kind === "drop" ? "左上が一番新しく置かれたカードです。タップで拡大。" : "左上が一番新しく置かれたカードです(ソウルの下から順)。タップで拡大。";
  let h = "";
  if (kind === "deck") {
    const cnt = {}; list.forEach(n => cnt[n] = (cnt[n] || 0) + 1);
    h = Object.keys(cnt).map(n => `<button type="button" class="pc" data-zz="${n}">${img(n)}<b>×${cnt[n]}</b></button>`).join("");
  } else {
    h = list.slice().reverse().map((n, i) => `<button type="button" class="pc" data-zz="${n}">${img(n)}${i === 0 ? "<i>NEW</i>" : ""}</button>`).join("") || '<p class="pnote">まだありません</p>';
  }
  $("pileG").innerHTML = h;
  $("pileG").querySelectorAll("[data-zz]").forEach(b => b.onclick = ev => { ev.stopPropagation(); zoom(b.dataset.zz); });
  $("pilesheet").hidden = false;
}
$("bMenu").onclick = () => $("menu").hidden = false;
$("mClose").onclick = () => $("menu").hidden = true;
$("mNew").onclick = backToStart;
$("bAgain").onclick = () => { $("over").hidden = true; newGame(); };
$("bBack").onclick = backToStart;
$("zoom").onclick = () => $("zoom").hidden = true;
function tokHTML(t, label) {
  const d = TT[t]; if (!d) return "";
  const lines = d.t.map(x => x.startsWith("〔スキル〕") ? `<p class="sk">${x.replace(/^〔スキル〕([^－]+)－/, "<b>〔スキル〕$1</b>－")}</p>` : `<p>${x}</p>`).join("");
  return `<div class="tk"><img alt="" src="img/${t}.webp"><div><h4>${d.n}<small>${label}</small></h4>${lines}</div></div>`;
}
function zoom(no, gauges, deck) {
  if (!no) return;
  const z = $("zoom"), isTok = String(no).startsWith("T");
  z.querySelector(".zm img").src = `img/${no}.webp`;
  z.querySelector(".zm figcaption").textContent = isTok && TT[no] ? TT[no].n : "";
  let h = "";
  if (isTok) h = tokHTML(no, ["T51","T52","T53"].includes(no) ? "SET ORDER" : "PERSONA GAUGE");
  for (const g of (gauges || [])) { const t = tokNo(g, deck); if (t) h += tokHTML(t, "PERSONA GAUGE"); }
  z.querySelector(".zt2").innerHTML = h;
  z.querySelector(".zm").hidden = isTok;
  z.classList.toggle("hasg", !!h && !isTok); z.scrollTop = 0;
  z.hidden = false;
}

function sizeCards() {
  const land = innerWidth > innerHeight && (innerHeight < 560 || innerWidth >= 900);
  const H = innerHeight, W = innerWidth;
  let ch;
  if (land) ch = Math.min((H - 60) / 6.7, (W * .62 - 30) / 6.6 / .6865);
  else ch = Math.min((H * .56 - 70) / 5.0, (W - 30) / 6.6 / .6865);
  document.documentElement.style.setProperty("--ch", Math.max(44, Math.min(120, ch)) + "px");
}
addEventListener("resize", () => { sizeCards(); });

const SLOTN = {FL:"前列左", FR:"前列右", BL:"後列左", BC:"中央後列", BR:"後列右", V:"ヴァンガード"};
const SLOTS = {FL:"前左", FR:"前右", BL:"後左", BC:"中央後", BR:"後右"};
function img(no) { return `<img alt="" src="img/${no}.webp" loading="lazy">`; }
function tokNo(name, deck) { if (name === "オルフェウス") return deck === "P3P" ? "T02" : "T01"; return TOK[name]; }

// 選択肢と画面上の要素の対応
function linkFor(q, o) {
  const id = String(o.id), k = q.kind;
  if (k === "main" && id.startsWith("call:")) return {hand: +id.slice(5)};
  if (k === "call_spot" && SLOTN[id]) return {slot: id};
  if (k === "attack" && SLOTN[id]) return {slot: id};
  if (k === "target" && SLOTN[id]) return {oslot: id};
  if (k === "trigger" && SLOTN[id]) return {slot: id};
  if (k === "over" && SLOTN[id]) return {slot: id};
  if (k === "guard") { if (id[0] === "H" || id[0] === "S") return {hand: +id.slice(1)}; if (id[0] === "I") return {slot: id.slice(1)}; }
  if (["mulligan","ride_cost","sent_cost"].includes(k)) return {hand: +id};
  return null;
}

function mat(p, who, q) {
  const isMe = who === "me";
  const rowsMe = [["FL","V","FR"],["BL","BC","BR"]];
  const rows = isMe ? rowsMe : [rowsMe[1], rowsMe[0]];
  let f = "";
  for (const row of rows) for (const k of row) {
    let inner = "", cls = "slot" + (k === "V" ? " vg" : "");
    const em = `<i class="em ${k === "V" ? "v" : "r"}" data-l="${k === "V" ? "V" : "R"}"></i>`;
    if (k === "V") {
      cls += p.vr ? " rest" : "";
      const up = p.vbon && p.vbon.length;
      const g = (p.vg_g || []).join("・");
      const vb = (p.vbon || []).map(([l, v]) => `${l}+${v >= 1e7 ? "1億" : (v / 10000) + "万"}`).join(" ");
      const gl = (p.vg_g || []).join("|");
      inner = `${em}<div class="cardw" data-z="${p.vno}" data-g="${gl}" data-dk="${p.name}">${img(p.vno)}</div>${g ? `<span class="gg" data-z="${p.vno}" data-g="${gl}" data-dk="${p.name}" role="button" aria-label="ペルソナゲージ ${g} を見る">${g}</span>` : ""}${vb ? `<span class="vb">${vb}</span>` : ""}<span class="pw${up ? " up" : ""}" title="${vb}">${fmt(p.vp)}</span>`;
    } else {
      const u = p.c[k];
      if (u) {
        cls += u.r ? " rest" : "";
        inner = `${em}<div class="cardw" data-z="${u.no}" data-g="${u.g || ""}" data-dk="${p.name}">${img(u.no)}</div>${u.g ? `<span class="gg" data-z="${u.no}" data-g="${u.g}" data-dk="${p.name}" role="button" aria-label="ペルソナゲージ ${u.g} を見る">${u.g}</span>` : ""}<span class="pw${u.bon && u.bon.length ? " up" : ""}">${fmt(u.p)}</span>${u.lk ? '<span class="lk"></span>' : ""}`;
      } else inner = em;
    }
    f += `<div class="${cls}" data-slot="${isMe ? k : ""}" data-oslot="${isMe ? "" : k}" aria-label="${SLOTN[k]}">${inner}</div>`;
  }
  const dm = [];
  for (let i = 0; i < 6; i++) { const d = p.dmg[i]; dm.push(d ? `<span class="dc ${d[1] ? "up" : "down"}" data-z="${d[2]}">${img(d[2])}<i>${i + 1}</i></span>` : `<span class="dc${i === 5 ? " d6" : ""}"><i>${i + 1}</i></span>`); }
  const arcs = Object.entries(p.arc || {}).filter(([a, n]) => n > 0).map(([a, n]) => `<span class="ac${n >= 3 ? " full" : ""}">${a}<i>${[0,1,2].map(j => `<u class="${j < n ? "on" : ""}"></u>`).join("")}</i></span>`).join("");
  const gz = (p.gz && p.gz.length) ? `<div class="gzl">G:${p.gz.map(g => (g.no ? img(g.no) : "") + (g.s === "完全ガード" ? "完全" : g.s)).join(" ")}</div>` : "";
  const ohand = isMe ? "" : `<span class="ohand">${Array.from({length: Math.min(p.hn, 10)}, () => "<i></i>").join("")}<span>&nbsp;${p.hn}</span></span>`;
  const up = p.dmg.filter(d => d[1]).length;
  return `<div class="zt dz"><div class="zl">ダメージ<small>${p.dmg.length}点 表${up}</small></div><div class="dzs">${dm.join("")}</div></div>
    <div class="field">${f}</div>
    <div class="rz">
      <div class="nmr"><span class="band deck-${p.name}"><b>${p.name}</b><span class="g">G${p.vgr}</span></span><span class="who">${isMe ? "YOU" : "AI"}</span>${ohand}</div>
      <div class="row">${isMe ? `<button type="button" class="zt pile deckp pb" data-pile="deck" data-who="me" aria-label="山札の中身を見る(順番はわかりません)">` : `<div class="zt pile deckp">`}<div class="zl">山札<small>DECK</small></div><div class="zv">${p.deck}</div>${isMe ? "</button>" : "</div>"}
        <button type="button" class="zt pile pb" data-pile="drop" data-who="${who}" aria-label="ドロップを見る"><div class="zl">ドロップ<small>DROP</small></div><div class="zv">${p.drop}</div></button></div>
      <div class="row"><button type="button" class="zt pile pb" data-pile="soul" data-who="${who}" aria-label="ソウルを見る"><div class="zl">ソウル<small>SOUL</small></div><div class="zv">${p.soul}</div></button>
        <div class="zt pile"><div class="zl">エネルギー<small>ENERGY</small></div><div class="zv">${p.en}</div></div></div>
      <div class="zt oz"><div class="zl">オーダー<small>ARCANA</small></div>${p.vgr >= 1 && TEAMTOK[p.name] ? `<button type="button" class="ttk" data-z="${TEAMTOK[p.name]}" aria-label="セットオーダー(チームトークン)を見る"><img alt="" src="img/${TEAMTOK[p.name]}.webp">セットオーダー</button>` : ""}<div class="arcs">${arcs || '<span class="ac">なし</span>'}</div>${gz}</div>
    </div>`;
}
function fmt(n) { return n >= 1e7 ? "1億+" : n.toLocaleString("ja-JP"); }

function render() {
  const c = cur, q = c.q;
  $("title").innerHTML = `${c.me.name} <i>VS</i> ${c.ai.name}` + (c.status === "ask" ? (c.me.turn === 0 && c.q.kind === "mulligan" ? "  マリガン" : `  ${c.active === "me" ? "自分" : "相手"}のターン`) : "");
  $("matOpp").innerHTML = mat(c.ai, "ai", q);
  $("matMe").innerHTML = mat(c.me, "me", q);
  document.querySelectorAll("[data-pile]").forEach(b => b.onclick = ev => { ev.stopPropagation(); showPile(b.dataset.pile, b.dataset.who); });
  $("matOpp").className = `mat vgmat opp deck-${c.ai.name}`; $("matMe").className = `mat vgmat me deck-${c.me.name}`;
  document.body.className = "deck-" + c.me.name;
  const gzz = (c.me.gz && c.me.gz.length) ? c.me.gz : (c.ai.gz || []);
  const gtot = gzz.some(g => g.s === "完全ガード") ? "完全ガード" : gzz.reduce((a, g) => a + (+g.s || 0), 0).toLocaleString("ja-JP");
  $("gcz").className = "gcz" + (gzz.length ? " on" : "");
  $("gcz").innerHTML = `<i class="em g" data-l="G"></i><span class="gtx">${gzz.length ? `${gzz.map(g => g.no ? img(g.no) : "").join("")}<span>シールド <b>${gtot}</b></span>` : "ガーディアンサークル"}</span>`;
  if (c.status === "ask" && c.active && c.active !== lastActive && !(c.me.turn === 0 && c.q && c.q.kind === "mulligan")) {
    const bn = $("banner"), mine = c.active === "me";
    bn.className = "banner deck-" + (mine ? c.me.name : c.ai.name);
    bn.querySelector("b").textContent = mine ? "YOUR TURN" : "ENEMY TURN";
    bn.querySelector("span").textContent = (mine ? "自分" : "相手") + `のターン`;
    void bn.offsetWidth; bn.classList.add("show");
  }
  if (c.active) lastActive = c.active;
  $("matOpp").classList.toggle("turn", c.active === "ai");
  $("matMe").classList.toggle("turn", c.active === "me");
  // 手札
  const h = $("hand"); h.innerHTML = "";
  (c.me.hno || []).forEach((no, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "hc"; b.dataset.hand = i;
    const t = c.me.htype[i];
    b.innerHTML = img(no) + (t && !t.startsWith("g") ? `<span class="tt ${t}"></span>` : "");
    b.dataset.z = no; h.appendChild(b);
  });
  // 拡大(選択に使っていない要素)
  document.querySelectorAll("[data-z]").forEach(el => {
    el.onclick = ev => { if (el.closest(".pick") && !el.classList.contains("gg")) return; ev.stopPropagation(); zoom(el.dataset.z, el.dataset.g ? el.dataset.g.split("|") : [], el.dataset.dk); };
  });
  if (c.status === "over") { renderPanel(null); showOver(); return; }
  renderPanel(q);
}

function renderPanel(q) {
  const opts = $("opts"); opts.innerHTML = "";
  $("conf").hidden = true;
  if (!q) { $("qt").textContent = "対戦終了"; $("qd").textContent = ""; return; }
  $("qt").textContent = q.title; $("qd").textContent = q.desc || "";
  const A = st.showAI !== false ? q.ai : null, aiIds = new Set(A ? A.ids.map(String) : []);
  const ah = $("aih");
  if (A) {
    const lab = q.multi ? (A.ids.length ? q.options.filter(o => aiIds.has(String(o.id))).map(o => o.label).join("・") : "何も選ばない") : (q.options.find(o => aiIds.has(String(o.id))) || {}).label || "";
    let why = A.why || "";
    const short = lab.replace(/^[^:]*:/, "");
    for (const x of [lab, short]) if (x && why.startsWith(x)) { why = why.slice(x.length).replace(/^[((]/, "").replace(/[))]$/, ""); break; }
    ah.innerHTML = `<b>AI</b><span class="t">AIなら <strong>${lab}</strong>${why ? "。" + why : ""}</span>${q.multi ? '<button type="button" id="aiSet">この案にする</button>' : ""}`;
    ah.hidden = false;
  } else { ah.hidden = true; ah.innerHTML = ""; }
  // 盤面・手札のハイライトを外す
  document.querySelectorAll(".pick,.sel").forEach(e => e.classList.remove("pick", "sel"));
  for (const o of q.options) {
    const b = document.createElement("button"); b.type = "button"; b.className = "ob" + (["end","none","no","cancel"].includes(String(o.id)) ? " end" : "");
    b.innerHTML = (o.no ? img(o.no) : "") + `<span><div class="l">${o.label}</div>${o.sub ? `<div class="s">${o.sub}</div>` : ""}</span>` + (aiIds.has(String(o.id)) ? '<span class="aib">AI</span>' : "");
    if (aiIds.has(String(o.id))) b.classList.add("airec");
    const pick = () => q.multi ? toggle(q, o) : answer(o.id);
    b.onclick = pick;
    b.dataset.oid = o.id;
    opts.appendChild(b);
    const ln = linkFor(q, o);
    if (ln) {
      const el = ln.hand !== undefined ? document.querySelector(`.hc[data-hand="${ln.hand}"]`) : ln.oslot ? document.querySelector(`#matOpp .slot[data-oslot="${ln.oslot}"]`) : document.querySelector(`#matMe .slot[data-slot="${ln.slot}"]`);
      if (el) { el.classList.add("pick"); el.onclick = ev => { ev.stopPropagation(); pick(); }; el.querySelectorAll("[data-z]").forEach(z => z.onclick = null); if (el.dataset.z) el.onclick = ev => { ev.stopPropagation(); pick(); }; }
    }
  }
  if (A && q.multi && $("aiSet")) $("aiSet").onclick = () => {
    multiSel = new Set(); q.options.forEach(o => { if (aiIds.has(String(o.id))) toggle(q, o); });
    if (!aiIds.size) { document.querySelectorAll("#opts .ob").forEach(b => b.classList.remove("on")); document.querySelectorAll(".sel").forEach(e => e.classList.remove("sel")); updSum(q); }
  };
  if (q.multi) { $("conf").hidden = false; updSum(q); $("bOk").onclick = () => answer(q.options.filter(o => multiSel.has(String(o.id))).map(o => o.id)); }
}
function toggle(q, o) {
  const id = String(o.id);
  if (q.kind === "guard" && id[0] === "S") multiSel = multiSel.has(id) ? new Set() : new Set([id]);
  else { [...multiSel].forEach(x => { if (q.kind === "guard" && x[0] === "S") multiSel.delete(x); }); multiSel.has(id) ? multiSel.delete(id) : multiSel.add(id); }
  document.querySelectorAll("#opts .ob").forEach(b => b.classList.toggle("on", multiSel.has(b.dataset.oid)));
  for (const o2 of q.options) {
    const ln = linkFor(q, o2); if (!ln) continue;
    const el = ln.hand !== undefined ? document.querySelector(`.hc[data-hand="${ln.hand}"]`) : ln.oslot ? document.querySelector(`#matOpp .slot[data-oslot="${ln.oslot}"]`) : document.querySelector(`#matMe .slot[data-slot="${ln.slot}"]`);
    if (el) el.classList.toggle("sel", multiSel.has(String(o2.id)));
  }
  updSum(q);
}
function updSum(q) {
  const ok = $("bOk"), s = $("sum");
  if (q.kind === "guard") {
    const sent = [...multiSel].some(x => x[0] === "S");
    let tot = 0;
    for (const o of q.options) if (multiSel.has(String(o.id))) { const m = /シールド(\d+)/.exec(o.sub || ""); if (m) tot += +m[1]; }
    const need = q.extra.need;
    if (sent) { s.innerHTML = "<b>完全ガード</b>"; ok.textContent = "ガード"; ok.classList.remove("ng"); }
    else if (!multiSel.size) { s.innerHTML = `ノーガード(必要 <b>${need}</b>)`; ok.textContent = "ノーガード"; ok.classList.add("ng"); }
    else { s.innerHTML = `シールド <b>${tot}</b> / 必要 <b>${need}</b>` + (tot >= need ? " → 止まる" : " → 足りない(トリガー次第)"); ok.textContent = "ガード"; ok.classList.toggle("ng", tot < need); }
  } else { s.textContent = `${multiSel.size}枚選択`; ok.textContent = "決定"; ok.classList.remove("ng"); }
}
function showOver() {
  const w = cur.winner === "me";
  $("ovT").innerHTML = w ? "WIN!<small>勝ち</small>" : "LOSE<small>負け</small>";
  $("over").classList.toggle("lose", !w);
  $("ovD").textContent = (w ? "相手" : "自分") + "の" + (cur.why || "敗北");
  $("over").hidden = false;
}
function renderLog() {
  const L = $("loglist"); L.innerHTML = "";
  for (const line of (cur ? cur.log : [])) {
    const d = document.createElement("div");
    const m = /^\[(自分|相手) T(\d+)\] (.*)$/.exec(line);
    if (m) {
      d.className = (m[1] === "自分" ? "me" : "ai") + (m[3].startsWith("===") ? " tn" : "");
      d.textContent = m[3].startsWith("===") ? `${m[1]} ${m[2]}ターン目 ${m[3].replace(/^=== ターン開始 /, "")}` : `${m[1] === "自分" ? "自" : "相"}  ${m[3]}`;
    } else d.textContent = line;
    L.appendChild(d);
  }
  L.scrollTop = L.scrollHeight;
}
renderStart();
if (st.game && !st.game.over && location.hash !== "#new") { /* 再開ボタンを出すだけ */ }
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
