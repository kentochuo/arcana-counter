<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="対戦練習">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ペルソナ対戦練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono:wght@700&display=swap">
<style>
/* デジタル庁デザインシステム(DADS)の色・文字・部品にそろえた明るい配色。
   レイアウト:縦向きは「相手の盤面/自分の盤面/手札」を縦に積み、選択肢は下のパネル。横向きは左に盤面、右にパネル。 */
:root{
  color-scheme:light;
  --white:#fff; --black:#000;
  --gray-50:#f2f2f2; --gray-100:#e6e6e6; --gray-200:#ccc; --gray-300:#b3b3b3; --gray-420:#949494; --gray-536:#767676;
  --gray-600:#666; --gray-700:#4d4d4d; --gray-800:#333; --gray-900:#1a1a1a;
  --key-50:#e8f1fe; --key-100:#d9e6ff; --key-200:#c5d7fb; --key-900:#0017c1; --key-1000:#00118f; --key-1200:#000060;
  --success:#197a4b; --success-50:#e6f5ec; --error:#ce0000; --error-50:#fdeeee; --warn-ink:#6e5600; --warn-50:#fbf5e0; --focus:#ffd43d;
  --bg:var(--white); --mat:var(--gray-50); --mat2:var(--gray-100); --line:var(--gray-300); --fg:var(--gray-800); --muted:var(--gray-600);
  --me:var(--key-900); --opp:#ce0000; --pick:var(--key-900); --sel:var(--success); --warn:#a58000;
  --crit:#ce0000; --draw:#d2a400; --front:#0066be; --heal:#197a4b; --over:#6f23d0; --sent:#767676;
  --body:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  --num:'Noto Sans Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --elev-1:0 2px 8px 1px rgba(0,0,0,.1),0 1px 5px 0 rgba(0,0,0,.3);
  --elev-4:0 6px 20px 4px rgba(0,0,0,.1),0 2px 6px 0 rgba(0,0,0,.3);
  --ch:60px; --cw:calc(var(--ch)*.6865);
}
*{box-sizing:border-box;touch-action:manipulation;-webkit-touch-callout:none}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);letter-spacing:.02em;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:4px solid var(--black);outline-offset:2px;box-shadow:0 0 0 2px var(--focus)}
.screen{height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}
/* ---------- 開始画面 */
#start{overflow-y:auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 32px max(16px,env(safe-area-inset-right,0px));gap:24px;max-width:560px;margin:0 auto;width:100%}
#start h1{font:700 28px/1.4 var(--body);color:var(--gray-900);margin:0;letter-spacing:.01em}
#start p{color:var(--gray-800);margin:0;font-size:16px;line-height:1.7}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .lab{font-size:16px;font-weight:700;color:var(--gray-900)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:64px;min-height:48px;padding:8px 6px;border-radius:8px;border:1px solid var(--gray-536);background:var(--white);color:var(--gray-800);font-weight:700;font-size:16px;cursor:pointer}
.seg button[aria-pressed="true"]{border:4px double transparent;background:var(--key-900);color:var(--white)}
.seg button[data-d="P3"][aria-pressed="true"]{background:#0066be;color:#fff}
.seg button[data-d="P3P"][aria-pressed="true"]{background:#c000c0;color:#fff}
.seg button[data-d="P4"][aria-pressed="true"]{background:#d2a400;color:#1a1a1a}
.seg button[data-d="P5"][aria-pressed="true"]{background:#ce0000;color:#fff}
@media (hover:hover){.seg button[aria-pressed="false"]:hover{background:var(--key-50);border-color:var(--key-900)}}
.big{min-height:56px;padding:12px 16px;border-radius:8px;border:4px double transparent;background:var(--key-900);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.big.sub{border:1px solid currentColor;background:var(--white);color:var(--key-900)}
@media (hover:hover){.big:hover{background:var(--key-1000);text-decoration:underline}.big.sub:hover{background:var(--key-200);color:var(--key-1000)}}
.big:active{background:var(--key-1200)}
#loadmsg{font-size:14px;color:var(--gray-600);text-align:center;min-height:1.5em}
#start p.hint{font-size:14px;line-height:1.7;color:var(--gray-600)}
/* ---------- 対戦画面 */
#game{position:relative}
.top{display:flex;align-items:center;gap:6px;padding:4px max(8px,env(safe-area-inset-left,0px)) 4px 8px;flex:none;border-bottom:1px solid var(--gray-200)}
.top .t{font-weight:700;font-size:14px;color:var(--gray-900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{border:1px solid currentColor;background:var(--white);color:var(--key-900);border-radius:6px;min-height:32px;padding:2px 10px;font-size:13px;font-weight:700;cursor:pointer}
@media (hover:hover){.tb:hover{background:var(--key-200);text-decoration:underline}}
.arena{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:6px 6px 4px}
.mat{background:var(--mat);border:1px solid var(--gray-200);border-radius:12px;padding:5px 6px;display:flex;gap:6px;align-items:center;min-height:0;position:relative}
.mat.opp{box-shadow:inset 4px 0 0 var(--opp)}
.mat.me{box-shadow:inset 4px 0 0 var(--me)}
.mat.turn.opp{border-color:var(--opp);box-shadow:inset 4px 0 0 var(--opp),inset 0 0 0 1px var(--opp)}
.mat.turn.me{border-color:var(--me);box-shadow:inset 4px 0 0 var(--me),inset 0 0 0 1px var(--me)}
.field{display:grid;grid-template-columns:repeat(3,var(--cw));gap:4px 6px;flex:none;margin-left:2px}
.slot{position:relative;width:var(--cw);height:var(--ch);border-radius:6px;border:1px dashed var(--gray-300);background:var(--white)}
.slot.vg{border:1px solid var(--gray-420)}
.slot .lb{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;color:var(--gray-536)}
.cardw{position:absolute;inset:0;transition:transform .25s}
.slot.rest .cardw{transform:rotate(90deg) scale(.68)}
.cardw img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.slot.rest img{filter:brightness(.8) saturate(.8)}
.pw{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font:700 10px/1.3 var(--num);background:rgba(26,26,26,.88);color:#fff;padding:0 4px;border-radius:4px;white-space:nowrap;z-index:2;pointer-events:none}
.pw.up{background:#ac3e00}
.gg{position:absolute;top:1px;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:700;background:rgba(26,26,26,.85);color:var(--focus);padding:0 3px;border-radius:3px;white-space:nowrap;z-index:2;max-width:100%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.lk{position:absolute;inset:0;border:2px dashed var(--error);border-radius:6px;pointer-events:none;background:rgba(206,0,0,.08)}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-self:stretch;justify-content:center}
.nm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--gray-900)}
.nm .tag{font-size:11px;padding:0 6px;border-radius:8px;border:1px solid var(--gray-536);background:var(--white);color:var(--gray-800);font-weight:400}
.nums{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:12px;color:var(--gray-600)}
.nums b{color:var(--gray-900);font-family:var(--num)}
.dmg{display:flex;gap:2px;flex-wrap:wrap}
.dc{width:calc(var(--cw)*.42);min-width:16px;aspect-ratio:300/437;border-radius:2px;overflow:hidden;position:relative}
.dc img{width:100%;height:100%;object-fit:cover;display:block}
.dc.down img{filter:grayscale(1) brightness(.55)}
.dc.empty{border:1px dashed var(--gray-300);background:var(--white)}
.arcs{display:flex;flex-wrap:wrap;gap:3px}
.ac{font-size:11px;border:1px solid var(--gray-536);background:var(--white);border-radius:8px;padding:0 5px;white-space:nowrap}
.ac.full{border-color:var(--key-900);background:var(--key-50);color:var(--key-900);font-weight:700}
.gz{display:flex;gap:3px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--warn-ink);font-weight:700}
.gz img{width:22px;border-radius:2px}
.handrow{flex:none;display:flex;gap:3px;overflow-x:auto;padding:4px 4px 2px;scrollbar-width:none;min-height:calc(var(--ch)*.95 + 8px)}
.handrow::-webkit-scrollbar{display:none}
.hc{flex:none;width:calc(var(--ch)*.95*.6865);height:calc(var(--ch)*.95);border-radius:6px;overflow:hidden;position:relative;cursor:pointer;border:0;padding:0;background:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.hc img{width:100%;height:100%;object-fit:cover;display:block}
.hc .tt{position:absolute;left:0;right:0;bottom:0;height:4px}
.hc .tt.crit{background:var(--crit)}.hc .tt.draw{background:var(--draw)}.hc .tt.front{background:var(--front)}.hc .tt.heal{background:var(--heal)}.hc .tt.over{background:var(--over)}.hc .tt.sentinel{background:var(--sent)}
.ohand{display:flex;gap:2px}
.ohand i{width:9px;height:13px;border-radius:2px;background:var(--gray-420);display:block}
/* 選べるもの/選んだもの */
.pick{outline:3px solid var(--pick);outline-offset:1px;border-radius:6px;cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
.sel{outline:3px solid var(--sel)!important;outline-offset:1px;animation:none}
.hc.sel{transform:translateY(-6px)}
@keyframes pulse{50%{outline-color:rgba(0,23,193,.3)}}
@media (prefers-reduced-motion:reduce){.pick{animation:none}.cardw{transition:none}}
/* ---------- 選択パネル */
#panel{flex:none;background:var(--white);border-top:1px solid var(--gray-420);box-shadow:0 -2px 8px rgba(0,0,0,.08);padding:8px max(10px,env(safe-area-inset-left,0px)) 8px max(10px,env(safe-area-inset-right,0px));
  max-height:42vh;display:flex;flex-direction:column;gap:6px}
#panel .q{font-weight:700;font-size:15px;color:var(--gray-900);line-height:1.5}
.ev{font-size:12px;color:var(--gray-600);max-height:5.8em;overflow-y:auto;border-left:3px solid var(--gray-200);padding-left:6px;flex:none;line-height:1.45}
.ev:empty{display:none}
.ev .a{color:#a90000}.ev .m{color:var(--key-900)}
#panel .d{font-size:13px;color:var(--gray-600);line-height:1.6}
#opts{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.ob{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--gray-536);background:var(--white);border-radius:8px;min-height:44px;padding:6px 10px;cursor:pointer;width:100%;color:var(--gray-900)}
@media (hover:hover){.ob:hover{background:var(--key-50);border-color:var(--key-900)}}
.ob img{width:26px;border-radius:3px;flex:none}
.ob .l{font-weight:700;font-size:14px}
.ob .s{font-size:12px;color:var(--gray-600)}
.ob.on{border:2px solid var(--key-900);background:var(--key-50);padding:5px 9px}
.ob.end{border:1px solid currentColor;color:var(--key-900);justify-content:center}
.ob.end .l{font-weight:700}
.confirm{display:flex;gap:8px;align-items:center}
.confirm .sum{flex:1;font-size:13px}
.confirm .sum b{font-family:var(--num)}
.confirm .ok{border:4px double transparent;background:var(--key-900);color:#fff;border-radius:8px;min-height:44px;padding:8px 18px;font-weight:700;font-size:15px;cursor:pointer}
.ok.ng{background:var(--warn);color:#fff}
.wait{font-size:13px;color:var(--gray-600)}
/* 横向き(高さが低い):盤面を左、パネルを右に */
@media (orientation:landscape) and (max-height:560px){
  #game .body{flex-direction:row}
  #game .left{flex:1;min-width:0}
  #panel{width:min(42vw,360px);max-height:none;border-top:0;border-left:1px solid var(--gray-420);box-shadow:-2px 0 8px rgba(0,0,0,.08);padding-top:6px}
  .top{padding-top:2px;padding-bottom:2px}
}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.left{flex:1;min-height:0;display:flex;flex-direction:column}
/* ---------- ログ・拡大・結果 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#logsheet{background:var(--white)}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .hd b{flex:1;font-size:18px;color:var(--gray-900)}
#loglist{flex:1;overflow-y:auto;background:var(--white);border:1px solid var(--gray-420);border-radius:8px;padding:6px 8px;font-size:13px;-webkit-user-select:text;user-select:text}
#loglist div{padding:2px 0;border-bottom:1px solid var(--gray-100);white-space:pre-wrap;word-break:break-all}
#loglist .me{color:var(--key-900)}#loglist .ai{color:#a90000}#loglist .tn{font-weight:700;color:var(--gray-900);border-top:1px solid var(--gray-420);margin-top:4px;padding-top:4px}
#zoom{align-items:center;justify-content:center}
#zoom img{max-width:min(86vw,380px);max-height:80vh;border-radius:12px;box-shadow:var(--elev-4)}
#over .box,#menu .box{margin:auto;background:var(--white);border-radius:16px;box-shadow:var(--elev-4);padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;min-width:280px;color:var(--gray-800)}
#over h2{margin:0;font-size:28px;color:var(--gray-900)}
#menu .box{padding:16px;gap:8px}
</style>
</head>
<body>
<section class="screen" id="start">
  <h1>ペルソナ対戦練習</h1>
  <p>自分のデッキを操作して、AIと対戦します。デッキはシミュレーターで探した最新のレシピです。</p>
  <div class="grp"><span class="lab">自分のデッキ</span><div class="seg" id="sMe"></div></div>
  <div class="grp"><span class="lab">相手のデッキ(AI)</span><div class="seg" id="sOpp"></div></div>
  <div class="grp"><span class="lab">先攻・後攻</span><div class="seg" id="sFirst"></div></div>
  <div class="grp"><span class="lab">相手AIの強さ</span><div class="seg" id="sAi"></div>
    <p class="hint" id="aiHint"></p></div>
  <button class="big" id="bStart" type="button">対戦を始める</button>
  <button class="big sub" id="bResume" type="button" hidden>前回の対戦の続きから</button>
  <div id="loadmsg">準備中…(初回は対戦エンジンの読み込みに少し時間がかかります)</div>
</section>

<section class="screen" id="game" hidden>
  <div class="top">
    <button class="tb" id="bMenu" type="button">≡</button>
    <span class="t" id="title"></span>
    <button class="tb" id="bUndo" type="button">1手戻す</button>
    <button class="tb" id="bLog" type="button">ログ</button>
  </div>
  <div class="body">
    <div class="left">
      <div class="arena">
        <div class="mat opp" id="matOpp"></div>
        <div class="mat me" id="matMe"></div>
      </div>
      <div class="handrow" id="hand"></div>
    </div>
    <div id="panel">
      <div class="ev" id="ev"></div>
      <div class="q" id="qt"></div>
      <div class="d" id="qd"></div>
      <div id="opts"></div>
      <div class="confirm" id="conf" hidden><span class="sum" id="sum"></span><button class="ok" id="bOk" type="button">決定</button></div>
    </div>
  </div>
</section>

<div class="sheet" id="logsheet" hidden><div class="hd"><b>対戦ログ</b><button class="tb" id="bLogClose" type="button">閉じる</button></div><div id="loglist"></div></div>
<div class="sheet" id="zoom" hidden><img alt=""></div>
<div class="sheet" id="over" hidden><div class="box"><h2 id="ovT"></h2><div id="ovD"></div>
  <button class="big" id="bAgain" type="button">同じデッキでもう一度</button><button class="big sub" id="bBack" type="button">デッキを選び直す</button>
  <button class="big sub" id="bOvLog" type="button">ログを見る</button><button class="big sub" id="bOvUndo" type="button">1手戻す</button></div></div>
<div class="sheet" id="menu" hidden><div class="box">
  <button class="big sub" id="mNew" type="button">対戦をやめてデッキ選択へ</button>
  <button class="big sub" id="mClose" type="button">閉じる</button></div></div>

<script>
const DECKS = ["P3","P3P","P4","P5"];
const NAMES = {P3:"P3 S.E.E.S.", P3P:"P3P 特別課外活動部", P4:"P4 自称特別捜査隊", P5:"P5 心の怪盗団"};
const LS = "persona-sim-v1";
const $ = id => document.getElementById(id);
let TOK = {};
fetch("tokens.json").then(r => r.json()).then(j => TOK = j).catch(() => {});
let st = {me:"P5", opp:"P3", first:"rand", ai:"strong", game:null};
try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s) st = Object.assign(st, s); } catch(e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e) {} };

// ---------- エンジン(Web Worker)
const worker = new Worker("worker.js");
let ready = false, reqId = 0, pending = {};
worker.onmessage = e => {
  const m = e.data;
  if (m.type === "ready") { ready = true; $("loadmsg").textContent = "準備できました"; return; }
  if (m.type === "fatal") { $("loadmsg").textContent = "読み込みに失敗しました:" + m.msg; return; }
  const p = pending[m.id]; delete pending[m.id];
  if (!p) return;
  if (m.type === "res") p.res(JSON.parse(m.res)); else p.rej(new Error(m.msg));
};
function engine(cfg, answers, cache) {
  return new Promise((res, rej) => { const id = ++reqId; pending[id] = {res, rej}; worker.postMessage({id, cfg, answers, cache: cache || []}); });
}

// ---------- 開始画面
function seg(el, items, cur, on, deckAttr) {
  el.innerHTML = "";
  for (const [v, l] of items) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = l; if (deckAttr) b.dataset.d = v;
    b.setAttribute("aria-pressed", v === cur); b.onclick = () => on(v); el.appendChild(b);
  }
}
function renderStart() {
  seg($("sMe"), DECKS.map(d => [d, d]), st.me, v => { st.me = v; save(); renderStart(); }, true);
  seg($("sOpp"), DECKS.map(d => [d, d]), st.opp, v => { st.opp = v; save(); renderStart(); }, true);
  seg($("sFirst"), [["first","先攻"],["second","後攻"],["rand","ランダム"]], st.first, v => { st.first = v; save(); renderStart(); });
  seg($("sAi"), [["normal","ふつう"],["strong","強い(先読み)"]], st.ai, v => { st.ai = v; save(); renderStart(); });
  $("aiHint").textContent = st.ai === "strong"
    ? "ダメージが大きくなる場面のガードで、候補ごとに試合の続きを何十回も試して一番勝てる手を選びます。考えるのに数秒かかることがあります。"
    : "いつもの判断(シミュレーターで調整した基準)で、すぐに動きます。";
  $("bResume").hidden = !(st.game && !st.game.over);
}
function newGame() {
  const first = st.first === "rand" ? Math.random() < .5 : st.first === "first";
  st.game = {cfg:{me:st.me, opp:st.opp, seed:Math.floor(Math.random() * 1e9), first, ai:st.ai}, answers:[], cache:[], over:false};
  save(); openGame();
}
$("bStart").onclick = newGame;
$("bResume").onclick = openGame;

// ---------- 対戦画面
let cur = null, multiSel = new Set(), busy = false;
function openGame() { prevLog = 1e9; $("start").hidden = true; $("game").hidden = false; sizeCards(); advance(); }
function backToStart() { $("game").hidden = true; $("over").hidden = true; $("menu").hidden = true; $("start").hidden = false; renderStart(); }
let prevLog = 0;
async function advance() {
  if (!ready) { $("qt").textContent = "対戦エンジンを読み込み中…"; $("opts").innerHTML = ""; setTimeout(advance, 400); return; }
  busy = true;
  const slow = setTimeout(() => { $("qt").textContent = "相手が考え中…"; $("opts").innerHTML = ""; }, 350);
  try { cur = await engine(st.game.cfg, st.game.answers, st.game.cache); }
  catch (e) { clearTimeout(slow); $("qt").textContent = "エラー:" + e.message; busy = false; return; }
  clearTimeout(slow);
  busy = false; multiSel = new Set();
  st.game.cache = cur.cache || [];
  const fresh = cur.log.slice(Math.min(prevLog, cur.log.length)).filter(l => !/盤面:|手札:/.test(l)).slice(-8);
  prevLog = cur.log.length;
  $("ev").innerHTML = fresh.map(l => { const m = /^\[(自分|相手) T\d+\] (.*)$/.exec(l); return m ? `<div class="${m[1] === "自分" ? "m" : "a"}">${m[1] === "自分" ? "自" : "相"} ${m[2].replace(/</g, "&lt;")}</div>` : ""; }).join("");
  $("ev").scrollTop = 1e6;
  st.game.over = cur.status === "over"; save();
  render();
}
function answer(a) {
  if (busy) return;
  prevLog = cur ? cur.log.length : 0;
  st.game.answers.push(a); save(); advance();
}
$("bUndo").onclick = $("bOvUndo").onclick = () => {
  if (busy || !st.game || !st.game.answers.length) return;
  st.game.answers.pop(); $("over").hidden = true; prevLog = 1e9; save(); advance();
};
$("bLog").onclick = $("bOvLog").onclick = () => { renderLog(); $("logsheet").hidden = false; };
$("bLogClose").onclick = () => $("logsheet").hidden = true;
$("bMenu").onclick = () => $("menu").hidden = false;
$("mClose").onclick = () => $("menu").hidden = true;
$("mNew").onclick = backToStart;
$("bAgain").onclick = () => { $("over").hidden = true; newGame(); };
$("bBack").onclick = backToStart;
$("zoom").onclick = () => $("zoom").hidden = true;
function zoom(no) { if (!no) return; $("zoom").querySelector("img").src = `img/${no}.webp`; $("zoom").hidden = false; }

function sizeCards() {
  const land = innerWidth > innerHeight && innerHeight < 560;
  const H = innerHeight, W = innerWidth;
  let ch;
  if (land) ch = Math.min((H - 70) / 5.2, (W * .58 - 40) / 3 / .6865);
  else ch = Math.min((H * .58 - 60) / 5.2, (W - 150) / 3 / .6865);
  document.documentElement.style.setProperty("--ch", Math.max(44, Math.min(120, ch)) + "px");
}
addEventListener("resize", () => { sizeCards(); });

const SLOTN = {FL:"前列左", FR:"前列右", BL:"後列左", BC:"中央後列", BR:"後列右", V:"ヴァンガード"};
const SLOTS = {FL:"前左", FR:"前右", BL:"後左", BC:"中央後", BR:"後右"};
function img(no) { return `<img alt="" src="img/${no}.webp" loading="lazy">`; }
function tokNo(name, deck) { if (name === "オルフェウス") return deck === "P3P" ? "T02" : "T01"; return TOK[name]; }

// 選択肢と画面上の要素の対応
function linkFor(q, o) {
  const id = String(o.id), k = q.kind;
  if (k === "main" && id.startsWith("call:")) return {hand: +id.slice(5)};
  if (k === "call_spot" && SLOTN[id]) return {slot: id};
  if (k === "attack" && SLOTN[id]) return {slot: id};
  if (k === "trigger" && SLOTN[id]) return {slot: id};
  if (k === "over" && SLOTN[id]) return {slot: id};
  if (k === "guard") { if (id[0] === "H" || id[0] === "S") return {hand: +id.slice(1)}; if (id[0] === "I") return {slot: id.slice(1)}; }
  if (["mulligan","ride_cost","sent_cost"].includes(k)) return {hand: +id};
  return null;
}

function mat(p, who, q) {
  const isMe = who === "me";
  const rowsMe = [["FL","V","FR"],["BL","BC","BR"]];
  const rows = isMe ? rowsMe : [rowsMe[1], rowsMe[0]];
  let f = "";
  for (const row of rows) for (const k of row) {
    let inner = "", cls = "slot" + (k === "V" ? " vg" : "");
    let link = "";
    if (k === "V") {
      cls += p.vr ? " rest" : "";
      const up = p.vbon && p.vbon.length;
      const g = (p.vg_g || []).join("・");
      inner = `<div class="cardw" data-z="${p.vno}">${img(p.vno)}</div>${g ? `<span class="gg">${g}</span>` : ""}<span class="pw${up ? " up" : ""}">${fmt(p.vp)}</span>`;
    } else {
      const u = p.c[k];
      if (u) {
        cls += u.r ? " rest" : "";
        inner = `<div class="cardw" data-z="${u.no}">${img(u.no)}</div>${u.g ? `<span class="gg">${u.g}</span>` : ""}<span class="pw${u.bon && u.bon.length ? " up" : ""}">${fmt(u.p)}</span>${u.lk ? '<span class="lk"></span>' : ""}`;
      } else inner = `<span class="lb">${SLOTS[k]}</span>`;
    }
    f += `<div class="${cls}" data-slot="${isMe ? k : ""}">${inner}</div>`;
  }
  const dm = [];
  for (let i = 0; i < 6; i++) { const d = p.dmg[i]; dm.push(d ? `<span class="dc ${d[1] ? "" : "down"}" data-z="${d[2]}">${img(d[2])}</span>` : (i < 5 ? `<span class="dc empty"></span>` : "")); }
  const arcs = Object.entries(p.arc || {}).filter(([a, n]) => n > 0).map(([a, n]) => `<span class="ac${n >= 3 ? " full" : ""}">${a}${n}</span>`).join("");
  const gz = (p.gz && p.gz.length) ? `<div class="gz">ガード:${p.gz.map(g => (g.no ? img(g.no) : "") + (g.s === "完全ガード" ? "完全" : g.s)).join(" ")}</div>` : "";
  const ohand = isMe ? "" : `<span class="ohand">${Array.from({length: Math.min(p.hn, 12)}, () => "<i></i>").join("")}</span><b>${p.hn}</b>`;
  return `<div class="field">${f}</div>
    <div class="side">
      <div class="nm"><span>${isMe ? "自分" : "相手(AI)"} ${p.name}</span><span class="tag">G${p.vgr}</span>${isMe ? "" : `<span class="nums">手札 ${ohand}</span>`}</div>
      <div class="dmg">${dm.join("")}</div>
      <div class="nums"><span>ダメージ <b>${p.dmg.length}</b>(表${p.dmg.filter(d => d[1]).length})</span><span>山札 <b>${p.deck}</b></span><span>ソウル <b>${p.soul}</b></span><span>エネ <b>${p.en}</b></span><span>ドロップ <b>${p.drop}</b></span></div>
      <div class="arcs">${arcs}</div>${gz}
    </div>`;
}
function fmt(n) { return n >= 1e7 ? "1億+" : n.toLocaleString("ja-JP"); }

function render() {
  const c = cur, q = c.q;
  $("title").textContent = `${c.me.name} vs ${c.ai.name}` + (c.status === "ask" ? (c.me.turn === 0 && c.q.kind === "mulligan" ? "  マリガン" : `  ${c.active === "me" ? "自分" : "相手"}のターン`) : "");
  $("matOpp").innerHTML = mat(c.ai, "ai", q);
  $("matMe").innerHTML = mat(c.me, "me", q);
  $("matOpp").classList.toggle("turn", c.active === "ai");
  $("matMe").classList.toggle("turn", c.active === "me");
  // 手札
  const h = $("hand"); h.innerHTML = "";
  (c.me.hno || []).forEach((no, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "hc"; b.dataset.hand = i;
    const t = c.me.htype[i];
    b.innerHTML = img(no) + (t && !t.startsWith("g") ? `<span class="tt ${t}"></span>` : "");
    b.dataset.z = no; h.appendChild(b);
  });
  // 拡大(選択に使っていない要素)
  document.querySelectorAll("[data-z]").forEach(el => {
    el.onclick = ev => { if (el.closest(".pick")) return; ev.stopPropagation(); zoom(el.dataset.z); };
  });
  if (c.status === "over") { renderPanel(null); showOver(); return; }
  renderPanel(q);
}

function renderPanel(q) {
  const opts = $("opts"); opts.innerHTML = "";
  $("conf").hidden = true;
  if (!q) { $("qt").textContent = "対戦終了"; $("qd").textContent = ""; return; }
  $("qt").textContent = q.title; $("qd").textContent = q.desc || "";
  // 盤面・手札のハイライトを外す
  document.querySelectorAll(".pick,.sel").forEach(e => e.classList.remove("pick", "sel"));
  for (const o of q.options) {
    const b = document.createElement("button"); b.type = "button"; b.className = "ob" + (["end","none","no","cancel"].includes(String(o.id)) ? " end" : "");
    b.innerHTML = (o.no ? img(o.no) : "") + `<span><div class="l">${o.label}</div>${o.sub ? `<div class="s">${o.sub}</div>` : ""}</span>`;
    const pick = () => q.multi ? toggle(q, o) : answer(o.id);
    b.onclick = pick;
    b.dataset.oid = o.id;
    opts.appendChild(b);
    const ln = linkFor(q, o);
    if (ln) {
      const el = ln.hand !== undefined ? document.querySelector(`.hc[data-hand="${ln.hand}"]`) : document.querySelector(`#matMe .slot[data-slot="${ln.slot}"]`);
      if (el) { el.classList.add("pick"); el.onclick = ev => { ev.stopPropagation(); pick(); }; el.querySelectorAll("[data-z]").forEach(z => z.onclick = null); if (el.dataset.z) el.onclick = ev => { ev.stopPropagation(); pick(); }; }
    }
  }
  if (q.multi) { $("conf").hidden = false; updSum(q); $("bOk").onclick = () => answer(q.options.filter(o => multiSel.has(String(o.id))).map(o => o.id)); }
}
function toggle(q, o) {
  const id = String(o.id);
  if (q.kind === "guard" && id[0] === "S") multiSel = multiSel.has(id) ? new Set() : new Set([id]);
  else { [...multiSel].forEach(x => { if (q.kind === "guard" && x[0] === "S") multiSel.delete(x); }); multiSel.has(id) ? multiSel.delete(id) : multiSel.add(id); }
  document.querySelectorAll("#opts .ob").forEach(b => b.classList.toggle("on", multiSel.has(b.dataset.oid)));
  for (const o2 of q.options) {
    const ln = linkFor(q, o2); if (!ln) continue;
    const el = ln.hand !== undefined ? document.querySelector(`.hc[data-hand="${ln.hand}"]`) : document.querySelector(`#matMe .slot[data-slot="${ln.slot}"]`);
    if (el) el.classList.toggle("sel", multiSel.has(String(o2.id)));
  }
  updSum(q);
}
function updSum(q) {
  const ok = $("bOk"), s = $("sum");
  if (q.kind === "guard") {
    const sent = [...multiSel].some(x => x[0] === "S");
    let tot = 0;
    for (const o of q.options) if (multiSel.has(String(o.id))) { const m = /シールド(\d+)/.exec(o.sub || ""); if (m) tot += +m[1]; }
    const need = q.extra.need;
    if (sent) { s.innerHTML = "<b>完全ガード</b>"; ok.textContent = "ガード"; ok.classList.remove("ng"); }
    else if (!multiSel.size) { s.innerHTML = `ノーガード(必要 <b>${need}</b>)`; ok.textContent = "ノーガード"; ok.classList.add("ng"); }
    else { s.innerHTML = `シールド <b>${tot}</b> / 必要 <b>${need}</b>` + (tot >= need ? " → 止まる" : " → 足りない(トリガー次第)"); ok.textContent = "ガード"; ok.classList.toggle("ng", tot < need); }
  } else { s.textContent = `${multiSel.size}枚選択`; ok.textContent = "決定"; ok.classList.remove("ng"); }
}
function showOver() {
  const w = cur.winner === "me";
  $("ovT").textContent = w ? "勝ち!" : "負け…";
  $("ovD").textContent = (w ? "相手" : "自分") + "の" + (cur.why || "敗北");
  $("over").hidden = false;
}
function renderLog() {
  const L = $("loglist"); L.innerHTML = "";
  for (const line of (cur ? cur.log : [])) {
    const d = document.createElement("div");
    const m = /^\[(自分|相手) T(\d+)\] (.*)$/.exec(line);
    if (m) {
      d.className = (m[1] === "自分" ? "me" : "ai") + (m[3].startsWith("===") ? " tn" : "");
      d.textContent = m[3].startsWith("===") ? `${m[1]} ${m[2]}ターン目 ${m[3].replace(/^=== ターン開始 /, "")}` : `${m[1] === "自分" ? "自" : "相"}  ${m[3]}`;
    } else d.textContent = line;
    L.appendChild(d);
  }
  L.scrollTop = L.scrollHeight;
}
renderStart();
if (st.game && !st.game.over && location.hash !== "#new") { /* 再開ボタンを出すだけ */ }
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
